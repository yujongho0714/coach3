<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>코치3 · 영상 비교</title>
<style>
:root{--bg:#14171a;--panel:#1d2227;--line:#2e353c;--tx:#e8ecef;--mut:#8b96a0;--ac:#ffb300;--me:#3dd6a0;--pro:#6aa8ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Noto Sans KR",sans-serif}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
@media (max-aspect-ratio:1/1){.stage{grid-template-columns:1fr}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
.pane h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.me h3{color:var(--me)}.pro h3{color:var(--pro)}
.vwrap{position:relative;background:#000;width:100%;max-height:60vh;margin:auto;aspect-ratio:16/9}
.vwrap video,.vwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.vwrap canvas{pointer-events:none}
.vwrap.draw canvas{pointer-events:auto;touch-action:none;cursor:crosshair}
.bar{padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line)}
button,select,label.btn{background:#2a3138;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--ac)}
button.on{background:var(--ac);color:#111;border-color:var(--ac)}
button.go{background:var(--me);color:#06251a;border-color:var(--me);font-weight:700}
input[type=file]{display:none}
input[type=range]{flex:1;min-width:160px;accent-color:var(--ac)}
input[type=color]{width:38px;height:36px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.t{font-variant-numeric:tabular-nums;color:var(--mut);min-width:150px}
small{color:var(--mut)}
</style>
</head>
<body>
<div class="stage">
  <div class="pane me">
    <h3>내 영상 <label class="btn">영상 선택<input type="file" id="fA" accept="video/*"></label></h3>
    <div class="vwrap" id="wA"><video id="vA" playsinline muted></video><canvas id="ov"></canvas></div>
  </div>
  <div class="pane pro">
    <h3>잘하는 선수 영상 <label class="btn">영상 선택<input type="file" id="fB" accept="video/*"></label></h3>
    <div class="vwrap" id="wB"><video id="vB" playsinline muted></video></div>
  </div>
</div>

<div class="bar">
  <button id="play" class="go">재생</button>
  <button id="m10">−10f</button><button id="m1">−1f</button>
  <button id="p1">+1f</button><button id="p10">+10f</button>
  <input type="range" id="sl" min="0" max="1" step="0.001" value="0">
  <span class="t" id="tm">0.000s · 0f</span>
</div>

<div class="bar">
  <span>속도</span>
  <select id="rate"><option>0.1</option><option>0.25</option><option selected>0.5</option><option>1</option><option>1.5</option></select>
  <span>프레임/초</span>
  <select id="fps"><option>24</option><option selected>30</option><option>60</option><option>120</option><option>240</option></select>
  <button id="sync">지금 장면을 동시점으로 맞추기</button>
  <span>선수 영상만 이동</span>
  <button id="b1m">−1f</button><button id="b1p">+1f</button>
  <small id="offt">차이 0.000s</small>
</div>

<div class="bar">
  <button id="dm">그리기 켜기</button>
  <button id="tp" class="on">펜</button><button id="tl">직선</button>
  <input type="color" id="col" value="#ff3b30">
  <span>표시</span>
  <select id="hold"><option value="1">1초</option><option value="2" selected>2초</option><option value="5">5초</option><option value="9999">계속</option></select>
  <button id="undo">되돌리기</button><button id="clr">전체 지우기</button>
  <button id="exp" class="go">내 영상만 저장</button>
  <small id="st">그림은 그린 시점부터 설정한 시간 동안 내 영상에만 표시됩니다.</small>
</div>
<div class="bar"><small>단축키: 스페이스=재생/정지 · ←/→=1프레임 · Shift+←/→=10프레임</small></div>

<script>
const $=s=>document.querySelector(s);
const A=$('#vA'),B=$('#vB'),cv=$('#ov'),cx=cv.getContext('2d'),sl=$('#sl');
let off=0,fps=30,strokes=[],tool='pen',cur=null,drawing=false;

function load(v,f){ if(f){ v.src=URL.createObjectURL(f); v.load(); } }
$('#fA').onchange=e=>load(A,e.target.files[0]);
$('#fB').onchange=e=>{load(B,e.target.files[0]);};
A.onloadedmetadata=()=>{
  cv.width=A.videoWidth; cv.height=A.videoHeight;
  $('#wA').style.aspectRatio=A.videoWidth+'/'+A.videoHeight;
  sl.max=A.duration; seek(0);
};
B.onloadedmetadata=()=>{ $('#wB').style.aspectRatio=B.videoWidth+'/'+B.videoHeight; };

const clamp=(v,d)=>Math.max(0,Math.min(isFinite(d)?d:v,v));
function seek(t){
  t=clamp(t,A.duration||0);
  A.currentTime=t;
  if(B.src) B.currentTime=clamp(t+off,B.duration||0);
}
function step(n){
  pause();
  const base=Math.round(A.currentTime*fps);
  seek((base+n)/fps+0.0005);
}
function play(){ A.play(); if(B.src) B.play(); $('#play').textContent='정지'; }
function pause(){ A.pause(); B.pause(); $('#play').textContent='재생'; }
$('#play').onclick=()=>A.paused?play():pause();
$('#m1').onclick=()=>step(-1); $('#p1').onclick=()=>step(1);
$('#m10').onclick=()=>step(-10); $('#p10').onclick=()=>step(10);
sl.oninput=()=>{pause();seek(+sl.value)};
$('#rate').onchange=e=>{A.playbackRate=B.playbackRate=+e.target.value};
$('#fps').onchange=e=>{fps=+e.target.value};
$('#sync').onclick=()=>{ if(!B.src)return; off=B.currentTime-A.currentTime; showOff(); };
function nudge(n){ pause(); off+=n/fps; B.currentTime=clamp(A.currentTime+off,B.duration||0); showOff(); }
$('#b1m').onclick=()=>nudge(-1); $('#b1p').onclick=()=>nudge(1);
function showOff(){ $('#offt').textContent='차이 '+off.toFixed(3)+'s'; }
A.onended=()=>{ if(!exporting) $('#play').textContent='재생'; };

addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='range')return;
  if(e.code==='Space'){e.preventDefault();A.paused?play():pause();}
  if(e.code==='ArrowLeft'){e.preventDefault();step(e.shiftKey?-10:-1);}
  if(e.code==='ArrowRight'){e.preventDefault();step(e.shiftKey?10:1);}
});

/* 그리기 */
const hold=()=>+$('#hold').value;
function drawStrokes(x,t,c){
  const k=c.width/800;
  for(const s of strokes){
    if(t<s.t-0.05||t>s.t+s.hold) continue;
    x.strokeStyle=s.c; x.lineWidth=4*k; x.lineCap=x.lineJoin='round';
    x.beginPath(); s.p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])); x.stroke();
  }
}
function redraw(){ cx.clearRect(0,0,cv.width,cv.height); drawStrokes(cx,A.currentTime,cv); }
function pos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*cv.width,(e.clientY-r.top)/r.height*cv.height]; }
cv.onpointerdown=e=>{
  pause(); drawing=true; cv.setPointerCapture(e.pointerId);
  cur={t:A.currentTime,c:$('#col').value,hold:hold(),p:[pos(e)]};
  if(tool==='line')cur.p.push(pos(e));
  strokes.push(cur);
};
cv.onpointermove=e=>{
  if(!drawing)return;
  if(tool==='line')cur.p[1]=pos(e); else cur.p.push(pos(e));
  redraw();
};
cv.onpointerup=()=>{drawing=false;redraw();};
$('#dm').onclick=e=>{ const w=$('#wA'); w.classList.toggle('draw'); const on=w.classList.contains('draw'); e.target.classList.toggle('on',on); e.target.textContent=on?'그리기 끄기':'그리기 켜기'; };
$('#tp').onclick=()=>{tool='pen';$('#tp').classList.add('on');$('#tl').classList.remove('on')};
$('#tl').onclick=()=>{tool='line';$('#tl').classList.add('on');$('#tp').classList.remove('on')};
$('#undo').onclick=()=>{strokes.pop();redraw()};
$('#clr').onclick=()=>{strokes=[];redraw()};

/* 화면 갱신 + 재생 중 동기화 보정 */
(function loop(){
  if(A.duration){
    if(document.activeElement!==sl) sl.value=A.currentTime;
    $('#tm').textContent=A.currentTime.toFixed(3)+'s · '+Math.round(A.currentTime*fps)+'f';
    if(!A.paused&&B.src&&!B.ended){
      const want=A.currentTime+off;
      if(Math.abs(B.currentTime-want)>0.15) B.currentTime=clamp(want,B.duration||0);
    }
    redraw();
  }
  requestAnimationFrame(loop);
})();

/* 내보내기: 내 영상 + 그림만 (선수 영상은 포함 안 됨) */
let exporting=false;
$('#exp').onclick=async()=>{
  if(!A.src||exporting)return;
  exporting=true; pause();
  const c=document.createElement('canvas'); c.width=A.videoWidth; c.height=A.videoHeight;
  const x=c.getContext('2d'), stream=c.captureStream(30);
  try{ A.captureStream().getAudioTracks().forEach(t=>stream.addTrack(t)); }catch(e){}
  const mt=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:8e6}:{});
  const chunks=[]; rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const prevRate=A.playbackRate; A.playbackRate=1;
  A.currentTime=0; await new Promise(r=>A.addEventListener('seeked',r,{once:true}));
  let run=true;
  rec.onstop=()=>{
    run=false; exporting=false; A.playbackRate=prevRate;
    const ext=rec.mimeType.includes('mp4')?'mp4':'webm';
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));
    a.download='내영상_피드백.'+ext; a.click();
    $('#st').textContent='저장 완료 (내 영상만)';
  };
  A.addEventListener('ended',()=>rec.state!=='inactive'&&rec.stop(),{once:true});
  rec.start(); A.play();
  $('#st').textContent='저장 중… 영상이 끝날 때까지 이 탭을 켜두세요.';
  (function f(){ if(!run)return; x.drawImage(A,0,0,c.width,c.height); drawStrokes(x,A.currentTime,c); requestAnimationFrame(f); })();
};
</script>
</body>
</html>
